services:
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: yourdbname
    ports:
      - "5432:5432"
    networks:
      - backend
    # [저사양 설정] DB도 메모리를 제한하여 실제 환경과 유사하게 만듭니다.
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: '128M'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web-http:
    build: .
    command: bash start.sh
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    env_file:
      - .env
    environment:
      - SERVER_TYPE=HTTP
      - TZ=Asia/Seoul
      - DJANGO_SETTINGS_MODULE=backend.settings
      - PYTHONUNBUFFERED=1
    networks:
      - backend

  # 2. WebSocket 전용 서버 (Daphne) - 핵심 최적화 대상
  web-ws:
    build: .
    command: bash start.sh
    volumes:
      - .:/code
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - db
    env_file:
      - .env
    environment:
      - SERVER_TYPE=WS
      - TZ=Asia/Seoul
      - DJANGO_SETTINGS_MODULE=backend.settings
      - PYTHONUNBUFFERED=1
    networks:
      - backend
    # [저사양 설정] Railway 무료 플랜 환경 강제 재현
    deploy:
      resources:
        limits:
          cpus: '0.1'      # CPU 사용량을 10%로 제한
          memory: '256M'   # 메모리를 256MB로 제한 (초과 시 컨테이너 종료됨)

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    environment:
      - TZ=Asia/Seoul
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: '64M'

  celery:
    build: .
    # [최적화] --concurrency=1 옵션으로 프로세스 수를 줄여 메모리 사용량을 최소화합니다.
    command: celery -A backend worker -l info --concurrency=1
    volumes:
      - .:/code
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - DJANGO_SETTINGS_MODULE=backend.settings 
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: '128M' # 이전 테스트에서 700MB였던 것을 강제로 다이어트 시킵니다.

  celery-beat:
    build: .
    command: celery -A backend beat -l info
    volumes:
      - .:/code
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - TZ=Asia/Seoul
      - DJANGO_SETTINGS_MODULE=backend.settings 
    networks:
      - backend
    deploy:
      resources:
        limits:
          cpus: '0.05'
          memory: '64M'

networks:
  backend:
    driver: bridge

volumes:
  postgres_data: