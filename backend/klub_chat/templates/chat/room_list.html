<head>
    <script src="https://cdn.jsdelivr.net/npm/@msgpack/msgpack@2.8.0/dist/msgpack.min.js"></script>
</head>
<div style="display: flex; align-items: center; gap: 10px; position: relative;">
    <h2>안녕하세요 {{ user.nickname }}님! 👋</h2>
    
    <div id="alarm-bell-container" style="position: relative; cursor: pointer; display: inline-block; padding: 5px;">
        <span style="font-size: 24px;">🔔</span>
        <span id="unread-dot" style="
            position: absolute; top: 5px; right: 5px;
            width: 10px; height: 10px;
            background-color: #ff4d4f; border-radius: 50%;
            display: none; border: 2px solid white; z-index: 10;"></span>
    </div>

    <div id="alarm-box" style="
        display: none; /* 처음엔 숨김 */
        position: absolute; top: 50px; left: 0;
        width: 320px; max-height: 400px; overflow-y: auto;
        background: white; border: 1px solid #ddd;
        border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        z-index: 1000; padding: 10px;">
        
        <h4 style="margin: 0 0 10px 0; border-bottom: 1px solid #eee; padding-bottom: 5px;">최근 미팅 알람</h4>
        <div id="meeting-alerts">
            </div>
        <div id="empty-msg" style="text-align: center; color: #888; padding: 20px 0;">새로운 알람이 없습니다.</div>
    </div>
</div>

<style>
    /* 알람 개별 아이템 스타일 */
    #meeting-alerts div {
        background-color: #f0f8ff;
        border-left: 4px solid #007bff;
        padding: 10px;
        margin-bottom: 8px;
        border-radius: 4px;
        font-size: 0.9em;
    }
    #meeting-alerts a {
        display: inline-block;
        margin-top: 5px;
        color: #007bff;
        text-decoration: none;
        font-weight: bold;
    }
</style>

<script>
// [상태 업데이트] 알람 유무에 따라 점 표시 및 메시지 전환
function updateAlarmStatus() {
    const dot = document.getElementById('unread-dot');
    const container = document.getElementById('meeting-alerts');
    const emptyMsg = document.getElementById('empty-msg');
    
    if (container.children.length > 0) {
        dot.style.display = 'block';
        if(emptyMsg) emptyMsg.style.display = 'none';
    } else {
        dot.style.display = 'none';
        if(emptyMsg) emptyMsg.style.display = 'block';
    }
}

// 미팅 렌더링 함수
function renderMeetingAlert(data) {
    const meetingAlerts = document.getElementById('meeting-alerts');
    const alertId = `alert-${data.meeting_id}`;
    if (document.getElementById(alertId)) return;

    const div = document.createElement('div');
    div.id = alertId;
    
    const linkHTML = data.join_url !== "#" 
        ? `<a href="${data.join_url}">참여하기</a>` 
        : `<span style="color:gray; font-size:0.8em;">(방 준비중)</span>`;

    div.innerHTML = `
        <strong>${data.title}</strong><br>
        <span class="time" style="color: #555;">${data.started_at} 시작</span> 
        ${linkHTML}
    `;
    
    meetingAlerts.prepend(div);
    updateAlarmStatus();
}

// 종 클릭 시 리스트 보이기/숨기기 토글
document.getElementById('alarm-bell-container').onclick = function(e) {
    const alarmBox = document.getElementById('alarm-box');
    const dot = document.getElementById('unread-dot');
    
    // 보이기/숨기기 토글
    if (alarmBox.style.display === 'none') {
        alarmBox.style.display = 'block';
        dot.style.display = 'none'; // 열면 빨간 점 사라짐
    } else {
        alarmBox.style.display = 'none';
    }
    
    e.stopPropagation(); // 윈도우 클릭 이벤트 전파 방지
};

// 알람 박스 외의 영역 클릭 시 닫기
window.onclick = function(event) {
    const alarmBox = document.getElementById('alarm-box');
    if (!event.target.closest('#alarm-bell-container') && !event.target.closest('#alarm-box')) {
        alarmBox.style.display = 'none';
    }
};

// 초기 데이터 로드 및 소켓 연결
async function init() {
    // 1. 초기 HTTP 데이터 로드 (이건 JSON 그대로 유지)
    try {
        const response = await fetch("/api/v1/chat/alarms/");
        const data = await response.json();
        if (data.meetings) data.meetings.forEach(renderMeetingAlert);
    } catch (e) { console.error("데이터 로드 실패:", e); }

    // 2. 웹소켓 설정 (MessagePack 대응)
    const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
    const wsUrl = protocol + window.location.hostname + ":8001/ws/meeting-alerts/";
    
    const ws = new WebSocket(wsUrl);
    
    // [중요] 바이너리 타입 설정 (진공 포장 박스를 받겠다!)
    ws.binaryType = "arraybuffer";
    
    ws.onmessage = (e) => {
        // [중요] MessagePack 해독
        const data = MessagePack.decode(new Uint8Array(e.data));
        renderMeetingAlert(data);
    };
    
    ws.onopen = () => console.log("✅ 알람 웹소켓 연결 성공 (8001)");
    ws.onerror = (err) => console.error("❌ 알람 웹소켓 연결 실패:", err);
}

init();
</script>
